name: CarX CD (Deploy & Release)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino do deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      tag:
        description: 'Tag customizada da imagem (opcional, padrão: sha do commit)'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Qualidade & Testes Pré-Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Check
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Unit & Integration Tests
        run: pnpm --filter @carx/api test

  build-and-push:
    name: Build & Push Imagens Docker (GHCR)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      target_env: ${{ steps.vars.outputs.env }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Definir Metadados de Versão
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TARGET_ENV="production"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
            if [ -n "${{ github.event.inputs.tag }}" ]; then
              TAG="${{ github.event.inputs.tag }}"
            fi
          else
            TARGET_ENV="staging"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "env=${TARGET_ENV}" >> $GITHUB_OUTPUT
          echo "REGISTRY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. API Fastify
      - name: Build & Push carx-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-api:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-api:${{ steps.vars.outputs.env }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Frontend Gestor & PWA (carx-web)
      - name: Build & Push carx-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            VITE_APP_ENV=${{ steps.vars.outputs.env }}
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-web:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-web:${{ steps.vars.outputs.env }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Frontend Super Admin (carx-admin-web)
      - name: Build & Push carx-admin-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/admin.Dockerfile
          push: true
          build-args: |
            VITE_APP_ENV=${{ steps.vars.outputs.env }}
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-admin-web:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-admin-web:${{ steps.vars.outputs.env }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-admin-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. WhatsApp Gateway (carx-wa)
      - name: Build & Push carx-wa
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/wa.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-wa:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-wa:${{ steps.vars.outputs.env }}
            ghcr.io/${{ env.REGISTRY_OWNER }}/carx-wa:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS via SSH
    needs: [validate, build-and-push]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Executar Deploy Remoto na VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_ENV: ${{ needs.build-and-push.outputs.target_env }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER || 'carx' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: TARGET_ENV,IMAGE_TAG
          script_stop: true
          script: |
            cd /home/carx/CarX
            git pull origin main
            echo "Iniciando deploy para ${TARGET_ENV} com tag ${IMAGE_TAG}..."
            bash infra/scripts/deploy.sh "${TARGET_ENV}" "${IMAGE_TAG}"

