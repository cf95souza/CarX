server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cabeçalhos de Segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    # Endpoint de Healthcheck para o Docker
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Service Worker e Manifest — NUNCA fazer cache longo
    location ~* (sw\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Assets com Hash Vite — Cache Imutável por 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Painel SuperAdmin servido sob /superadm (padrão OperaBeauty)
    location = /superadm {
        return 301 /superadm/;
    }

    location ^~ /superadm/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /superadm/ {
        try_files $uri $uri/ /superadm/index.html;
        add_header Cache-Control "no-cache";
    }

    # SPA Fallback (todas as rotas caem no index.html)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Bloqueio de arquivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

