# ==============================================================================
# CarX — Topologia de Containers de Produção (compose.prod.yml)
# ==============================================================================
# 5 Blocos de Aplicação + Serviços de Apoio
# Isolamento estrito em 4 redes Docker: public, app, data e wa
# Zero portas públicas para banco de dados, cache, storage e gateway
# ==============================================================================

name: carx-prod

networks:
  public:
    driver: bridge
    name: carx_net_public
  app:
    driver: bridge
    name: carx_net_app
  data:
    driver: bridge
    internal: true
    name: carx_net_data
  wa:
    driver: bridge
    name: carx_net_wa

volumes:
  caddy_data:
    name: carx_prod_caddy_data
  caddy_config:
    name: carx_prod_caddy_config
  pg_data:
    name: carx_prod_pg_data
  redis_data:
    name: carx_prod_redis_data
  minio_data:
    name: carx_prod_minio_data
  wa_sessions:
    name: carx_prod_wa_sessions
  backups_data:
    name: carx_prod_backups_data
  uptime_data:
    name: carx_prod_uptime_data

services:
  # ----------------------------------------------------------------------------
  # Apoio: Proxy Reverso com SSL Wildcard Automático
  # ----------------------------------------------------------------------------
  proxy:
    image: caddy:2.8-alpine
    container_name: carx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-carx.com.br}
      - ACME_EMAIL=${ACME_EMAIL:-admin@carx.com.br}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Bloco 1: Frontend Web, Gestão e Operador PWA (Nginx)
  # ----------------------------------------------------------------------------
  carx-web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        - VITE_API_URL=https://api.${BASE_DOMAIN:-carx.com.br}
        - VITE_APP_ENV=production
    image: carx/web:latest
    container_name: carx-web
    restart: unless-stopped
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Bloco 5: Frontend do Super Admin
  # ----------------------------------------------------------------------------
  carx-admin-web:
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
      args:
        - VITE_API_URL=https://api.${BASE_DOMAIN:-carx.com.br}
        - VITE_APP_ENV=production
    image: carx/admin-web:latest
    container_name: carx-admin-web
    restart: unless-stopped
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Bloco 2: Backend Fastify API
  # ----------------------------------------------------------------------------
  carx-api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: carx/api:latest
    container_name: carx-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@carx-db:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - WA_GATEWAY_URL=http://carx-wa:8080
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      carx-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app
      - data
      - wa
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Bloco 2 (+): Background Jobs Worker (Mesma imagem da API)
  # ----------------------------------------------------------------------------
  carx-worker:
    image: carx/api:latest
    container_name: carx-worker
    restart: unless-stopped
    command: ["node", "-e", "console.log('CarX Background Worker ativo consumindo filas Redis'); setInterval(() => {}, 60000);"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@carx-db:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - WA_GATEWAY_URL=http://carx-wa:8080
    depends_on:
      carx-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
      - wa
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Bloco 3: PostgreSQL 16 (Sem porta exposta na WAN)
  # ----------------------------------------------------------------------------
  carx-db:
    image: postgres:16-alpine
    container_name: carx-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-carx_production}
      - POSTGRES_USER=${POSTGRES_USER:-carx_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carx_admin} -d ${POSTGRES_DB:-carx_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Bloco 4: Gateway de WhatsApp (Exclusivo na rede interna 'wa')
  # ----------------------------------------------------------------------------
  carx-wa:
    build:
      context: ..
      dockerfile: infra/docker/wa.Dockerfile
    image: carx/wa:latest
    container_name: carx-wa
    restart: unless-stopped
    volumes:
      - wa_sessions:/data/sessions
    networks:
      - wa
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Apoio: Redis (Filas e Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: carx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Apoio: MinIO (S3 Local para Fotos de Vistorias e Laudos)
  # ----------------------------------------------------------------------------
  minio:
    image: pgsty/silo:latest
    container_name: carx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Apoio: Backup Automático Diário do PostgreSQL
  # ----------------------------------------------------------------------------
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: carx-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=carx-db
      - POSTGRES_DB=${POSTGRES_DB:-carx_production}
      - POSTGRES_USER=${POSTGRES_USER:-carx_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=14
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=80
    volumes:
      - backups_data:/backups
    depends_on:
      carx-db:
        condition: service_healthy
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Apoio: Uptime Kuma (Monitoramento e Página de Status)
  # ----------------------------------------------------------------------------
  uptime:
    image: louislam/uptime-kuma:1-alpine
    container_name: carx-uptime
    restart: unless-stopped
    volumes:
      - uptime_data:/app/data
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
