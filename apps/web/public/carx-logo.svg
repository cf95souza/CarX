<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="cx-volt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF33"/>
      <stop offset="100%" stop-color="#9BC800"/>
    </linearGradient>
    <filter id="cx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ícone Emblema CX -->
  <g transform="translate(4, 6)">
    <!-- Base Badge Hexagonal / Escudo Dinâmico -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#0E1116" stroke="#2E3744" stroke-width="2"/>
    <rect x="2" y="2" width="48" height="48" rx="12" fill="#171C24"/>
    
    <!-- Traço Acelerador Volt -->
    <path d="M12 38L22 14H28L18 38H12Z" fill="url(#cx-volt-grad)"/>
    <path d="M22 28L36 14H42L28 28L42 42H36L22 28Z" fill="#C8F52E" filter="url(#cx-glow)"/>
    
    <!-- Ponto de Precisão Neon -->
    <circle cx="34" cy="28" r="2.5" fill="#0E1116"/>
    <circle cx="34" cy="28" r="1.5" fill="#C8F52E"/>
  </g>

  <!-- Tipografia Space Grotesk / Display CarX -->
  <g transform="translate(68, 42)">
    <text font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="-1">
      <tspan fill="#F2F5F8">Car</tspan><tspan fill="#C8F52E">X</tspan>
    </text>
    <rect x="106" y="-23" width="34" height="13" rx="4" fill="#C8F52E"/>
    <text x="110" y="-13" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#0E1116" letter-spacing="1">AUTO</text>
  </g>
</svg>
